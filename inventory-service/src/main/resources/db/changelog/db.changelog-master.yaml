
databaseChangeLog:
  - changeSet:
      id: inventory-service-0001-create-inventory
      author: inventory
      changes:
        - createTable:
            tableName: inventory
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: productName
                  type: VARCHAR(255)

              - column:
                  name: quantity
                  type: INTEGER
