apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: hemantdevgan/micro-product-service:v1.0
        ports:
        - containerPort: 8086
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/productservice"
        - name: JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/ecommerce"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "admin123"

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecom-micro
spec:
  selector:
    app: product-service
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
