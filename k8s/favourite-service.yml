apiVersion: apps/v1
kind: Deployment
metadata:
  name: favourite-service
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: favourite-service
  template:
    metadata:
      labels:
        app: favourite-service
    spec:
      containers:
      - name: favourite-service
        image: hemantdevgan/micro-favourite-service:v1.0
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/favouriteservice"
        - name: JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/ecommerce"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"
        - name: POSTGRES_USER
          value: "admin"
        - nmae: POSTGRES_PASSWORD
          value: "admin123"

---

apiVersion: v1
kind: Service
metadata:
  name: favourite-service
  namespace: ecom-micro
spec:
  selector:
    app: favourite-service
  type: NodePort
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30003
    protocol: TCP