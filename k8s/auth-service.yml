apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: hemantdevgan/micro-auth-service:v1.0
        ports:
        - containerPort: 8088
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/authservice"
        - name: JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/ecommerce"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecom-micro
spec:
  selector:
    app: auth-service
  type: NodePort
  ports:
  - port: 8088
    targetPort: 8088
    nodePort: 30002
    protocol: TCP