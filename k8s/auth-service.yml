apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: hemantdevgan/micro-auth-service:v1.1
        ports:
        - containerPort: 8088
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/authservice"
        - name: JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/ecommerce"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "admin123"
        - name: SSO_BACKEND_CALLBACK_URL
          value: "http://3.24.124.211:30006/api/v1/auth/callback"
        - name: KEYCLOAK_PUBLIC_SERVER_URL
          value: "http://3.24.124.211:30001"
        - name: SSO_DEFAULT_FRONTEND_REDIRECT
          value: "http://3.24.124.211:3001/auth/callback"

        - name: SSO_ALLOWED_REDIRECT_URIS
          value: "http://3.24.124.211:3001/auth/callback,http://3.24.124.211:3000/auth/callback,http://localhost:3001/auth/callback,http://localhost:3000/auth/callback"


---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecom-micro
spec:
  selector:
    app: auth-service
  type: NodePort
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30002
      protocol: TCP
