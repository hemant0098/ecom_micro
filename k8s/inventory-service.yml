apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: hemantdevgan/micro-inventory-service:v1.0
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/authservice"
        - name: JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/ecommerce"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "admin123"

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecom-micro
spec:
  selector:
    app: inventory-service
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
