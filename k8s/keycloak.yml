apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.4.2
        args: ["start-dev"]
        ports:
        - containerPort: 8080
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "admin123"
        
--- 

apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ecom-micro
spec:
  selector:
    app: keycloak
  type: NodePort
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30001
    protocol: TCP