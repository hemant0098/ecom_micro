apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: ecom-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
      - name: search-service
        image: hemantdevgan/micro-search-service:v1.0
        ports:
        - containerPort: 8094
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/notificationservice"
        - name: JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/ecommerce"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "admin123"
        - name: KAFKA_SERVERS
          value: "kafka:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: ecom-micro
spec:
  selector:
    app: search-service
  type: ClusterIP
  ports:
    - port: 8094
      targetPort: 8094
