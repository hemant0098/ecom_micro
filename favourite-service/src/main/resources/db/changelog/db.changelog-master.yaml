databaseChangeLog:
  - changeSet:
      id: favourite-service-0001-bootstrap
      author: codex
      comment: Create favourites table.
      changes:
        - createTable:
            tableName: favourites
            columns:
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_favourites

              - column:
                  name: product_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    primaryKey: true

              - column:
                  name: like_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    primaryKey: true